version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Poprawki i drobne wersje narzędzi dev w jednym PR — mniej szumu.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # react i react-dom muszą mieć tę samą wersję (peer dependency),
      # więc podbijamy je razem — osobne PR-y wywalają npm install.
      react:
        patterns: [react, react-dom]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
