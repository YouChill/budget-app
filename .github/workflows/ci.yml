name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          # Build wymaga zmiennych (src/lib/supabase.js), ale nie łączy się z bazą.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Brak wyciągów bankowych i sekretów w repo
        run: bash sprawdz_przed_merge.sh
      - name: Podatności w zależnościach produkcyjnych
        run: npm audit --omit=dev --audit-level=high
      # Narzędzia dev (vite, vitest) nie trafiają na produkcję, ale działają
      # lokalnie z dostępem do repo i przeglądarki — też ich pilnujemy.
      - name: Podatności w zależnościach deweloperskich
        run: npm audit --include=dev --audit-level=high

  sql:
    name: Testy migracji SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash migration/tests/run_sql_tests.sh

  # ── Migracje bazy (Supabase CLI, darmowe) ────────────────────────────────
  # Nowe migracje: supabase/migrations/<timestamp>_nazwa.sql
  # (`npx supabase migration new nazwa`). Na PR — podgląd (--dry-run),
  # po merge do main — wdrożenie, dopiero gdy lint/testy/testy SQL są zielone.
  # Wymaga sekretów repo: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD.
  # Bez nich job kończy się ostrzeżeniem, nie błędem.
  migrations:
    name: Migracje Supabase (${{ github.event_name == 'push' && 'db push' || 'dry-run' }})
    needs: [app, sql]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: rrkmtyitoghfntiprcgh
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź sekrety
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Brak sekretów SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD — migracje pominięte (README → Migracje bazy)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: 2.120.0
      - name: Połącz z projektem
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Podgląd migracji (PR)
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Wdrożenie migracji (main)
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
